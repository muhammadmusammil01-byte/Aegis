<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Admin Dashboard - NexusHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
    </style>
</head>
<body class="flex items-center justify-center px-4">
    <div class="glass rounded-2xl p-8 max-w-2xl w-full text-center">
        <h1 class="text-4xl font-bold text-white mb-4">Center Admin Dashboard</h1>
        <p class="text-white/80 mb-8">Upload projects, manage mentors, and issue certificates</p>
        
        <div class="space-y-4 text-white/70 text-left">
            <div class="glass rounded-xl p-4">
                <h3 class="font-bold text-white mb-2">✓ Backend APIs Ready</h3>
                <p class="text-sm">POST /api/center-admin/projects - Upload showcase projects</p>
                <p class="text-sm">POST /api/center-admin/mentors - Add mentors to your center</p>
                <p class="text-sm">POST /api/center-admin/certificates - Issue Smart QR Certificates</p>
            </div>
        </div>

        <button onclick="logout()" class="mt-8 px-6 py-3 bg-red-500/20 text-white rounded-lg hover:bg-red-500/30 transition">
            Logout
        </button>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
