<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexusHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
    </style>
</head>
<body class="flex items-center justify-center px-4">
    <div class="glass rounded-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-white/70">Login to your NexusHub account</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-white/80 text-sm mb-2">Email</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 placeholder-white/50 focus:outline-none focus:border-white/50"
                    placeholder="your@email.com">
            </div>

            <div>
                <label class="block text-white/80 text-sm mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 placeholder-white/50 focus:outline-none focus:border-white/50"
                    placeholder="••••••••">
            </div>

            <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500 text-white px-4 py-2 rounded-lg text-sm"></div>
            <div id="successMessage" class="hidden bg-green-500/20 border border-green-500 text-white px-4 py-2 rounded-lg text-sm"></div>

            <button type="submit" 
                class="w-full bg-white text-purple-600 px-4 py-3 rounded-lg font-semibold hover:bg-gray-100 transition">
                Login
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-white/70 text-sm">
                Don't have an account? 
                <a href="/register.html" class="text-white font-semibold hover:underline">Sign up</a>
            </p>
        </div>

        <div class="mt-4 text-center">
            <a href="/nexushub-index.html" class="text-white/70 text-sm hover:text-white transition">← Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Store token
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                successMsg.textContent = 'Login successful! Redirecting...';
                successMsg.classList.remove('hidden');

                // Redirect to role-based dashboard
                setTimeout(() => {
                    window.location.href = data.dashboardPath || '/dashboard';
                }, 1000);

            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
