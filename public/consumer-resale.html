<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resale Market - AEGIS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <a href="/">
          <h1>🛡️ AEGIS</h1>
          <span class="tagline">Consumer Command Center</span>
        </a>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="/consumer-library.html">My Library</a>
        <a href="/consumer-certificate.html">Certificates</a>
        <a href="/consumer-resale.html" class="active">Resale Market</a>
        <a href="/marketplace.html">Browse</a>
        <a href="#" id="logoutLink">Logout</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Secondary Resale Market</h1>
      <p>Buy and sell licensed rights</p>
    </div>
  </section>

  <section class="resale-content">
    <div class="container">
      
      <div class="tabs">
        <button class="tab-btn active" data-tab="available">Available for Purchase</button>
        <button class="tab-btn" data-tab="mylistings">My Listings</button>
      </div>

      <!-- Available Resales -->
      <div id="availableTab" class="tab-content active">
        <div id="availableResales" class="marketplace-grid">
          <div class="loading">Loading resale market...</div>
        </div>
      </div>

      <!-- My Listings -->
      <div id="mylistingsTab" class="tab-content">
        <div id="myListings" class="marketplace-grid">
          <div class="loading">Loading your listings...</div>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2024 AEGIS Rights Broker. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/consumer-resale.js"></script>
</body>
</html>
